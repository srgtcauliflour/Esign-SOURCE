name: SideVault
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SIDEVAULT_SERVER_URL: "http://localhost:4567"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  SideVault:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      # A real, checked-in Info.plist (not XcodeGen-synthesized) — its
      # NSAppTransportSecurity/UILaunchScreen/SIDEVAULT_SERVER_URL keys live
      # there. XcodeGen excludes this path from the target's compiled/copied
      # sources automatically since it's also used as info.path.
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_NAME: SideVault
        # Overridden from the CI workflow via xcodebuild's command-line build
        # setting syntax; this placeholder only applies to a local Xcode build.
        PRODUCT_BUNDLE_IDENTIFIER: "com.sidevault.app"
